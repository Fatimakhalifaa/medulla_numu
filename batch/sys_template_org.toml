[variations]
keys = [ 'nominal_nue','var00', 'var01p','var01m', 'var02m','var02p', 'var03m', 'var03p','var04m','var04p','var05','var06','var07','var08','var09']
origin = 'events/'
tree = 'selected'
result_destination = 'detsys_results/'
variable = 'reco_leading_muon_ke'
bins = [15, 0, 3000]
nuniverses = 1000
variable_length = false

[[tree]]
origin = 'events/cvext/selected'
destination = 'events/cvext/'
name = 'selected'
action = 'add_weights'
#table_types = ['variation']
table_types = ['multisim', 'multisigma', 'variation']

[[tree]]
origin = 'events/cvext/signal'
destination = 'events/cvext/'
