[[tree]]
name = "eventLevel"
sim_only = false
mode = "event"
cut = []
branch = [
    { name = "ntrue",         type = "event"    },
    { name = "nreco",         type = "event"    },
    { name = "nnu",           type = "event"    },
    { name = "nintime",       type = "event", parameters = [ "@flash_low_t", "@flash_high_t" ] },
    { name = "nnu_mu",        type = "event"    },
    { name = "nnu_e",         type = "event"    },
]


[[category]] # 0 : Signal, fiducial muon neutrino CC events, w/ muon and  non-contained
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "iscc"            },
    { name = "neutrino_pdg",              parameters = [ 14.0] },
    { name = "has_particle_multiplicity", parameters = [ 1, 2 ] },
    { name = "no_photons",                parameters = [ "@photon_threshold" ] },
    { name = "no_electrons",              parameters = [ "@electron_threshold" ] },
    #{ name = "containment_cut" },
    { name = "leading_muon_energy_cut",   parameters = [ "@muon_threshold" ] },

]

[[category]] # 1 : muon neutrino CC events, w/ muon, but non-fiducial or non-contained
cuts = [
    { name = "neutrino"        },
    { name = "iscc"            },
    { name = "neutrino_pdg",              parameters = [ 14.0] },
    { name = "has_particle_multiplicity", parameters = [ 1, 2 ] },
    { name = "no_photons",                parameters = [ "@photon_threshold" ] },
    { name = "no_electrons",              parameters = [ "@electron_threshold" ] },
    { name = "leading_muon_energy_cut",   parameters = [ "@muon_threshold" ] },
]

[[category]] # 2 : Electron neutrino CC events, fiducial and uncontained
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "iscc"            },
    { name = "neutrino_pdg",          parameters = [ 12.0 ] },
    #{ name = "no_photons",            parameters = [ "@photon_threshold" ] },
    #{ name = "containment_cut" },
]

[[category]] # 3 : Out of fiducial volume and uncontained neutrino events
cuts = [
    { name = "neutrino"        },
    { name = "iscc"}
]

[[category]] # 4 : Neutral current events, unfiducial and uncontained
cuts = [
    { name = "neutrino"        },
    { name = "!iscc"            },
]

[[category]] # 5 : Cosmic events
cuts = [
    { name = "!neutrino"        },
]

[[category]] # 6 : Other ?
cuts = [
]