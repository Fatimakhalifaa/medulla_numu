[parameters]
photon_threshold = 25.0
electron_threshold = 25.0
#muon_threshold = 143.425
muon_threshold = 200.0
pion_threshold = 25.0
proton_threshold = 50.0
trackLength_threshold = 190.0
electron_dedx = 3.625
flash_low_t = 0.0
flash_high_t = 9.6
vertex_threshold = 3.25
muon_softmax = 0.5
primary_muon_softmax = 0.8
electron_id = 1.0
greater_than = 1.0


[general]
output = "output_numuCCInclusive_uncontained"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
    "@vertex_threshold",
    "@muon_softmax",
    "@primary_muon_softmax",
    "@flash_low_t",
    "@flash_high_t",
    "@greater_than",
]


