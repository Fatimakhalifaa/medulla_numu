[[tree]]
name = "all"
sim_only = false
#issignal = false
#isdata = false
add_systematics = false
add_exposure = true
mode = "reco"
cut = [
    { name = "trigger_emulation_cut",     type = "event", decrements_exposure = false },
    { name = "data_quality_cut",          type = "event", decrements_exposure = true  },
]
branch = [
    # cuts
    { name = "no_cut",                    type = "both"    },
    { name = "neutrino",                  type = "true"    },
    { name = "fiducial",                  type = "both"    },
    { name = "fiducial_cut",              type = "both"    },
    { name = "valid_flashmatch",          type = "both"    },
    { name = "containment",               type = "both"    },
    { name = "containment_cut",           type = "both"    },

    # cuts as branch variables
    { name = "flash_cut",                 type = "both", parameters = [ "@flash_low_t", "@flash_high_t" ] },
    { name = "no_photons",                type = "both", parameters = [ "@photon_threshold"   ] },
    { name = "no_electrons",              type = "both", parameters = [ "@electron_threshold" ] },
    { name = "no_muons",                  type = "both", parameters = [ "@muon_threshold"     ] },
    { name = "no_charged_pions",          type = "both", parameters = [ "@pion_threshold"     ] },
    { name = "no_protons",                type = "both", parameters = [ "@proton_threshold"   ] },
    { name = "single_muon",               type = "both", parameters = [ "@muon_threshold"     ] },
    { name = "single_proton",             type = "both", parameters = [ "@proton_threshold" ] },
    { name = "multiproton",               type = "both", parameters = [ "@proton_threshold" ] },
    { name = "photon_multiplicity",       type = "both", parameters = [ "@photon_threshold"   ] },
    { name = "electron_multiplicity",     type = "both", parameters = [ "@electron_threshold" ] },
    { name = "muon_multiplicity",         type = "both", parameters = [ "@muon_threshold"     ] },
    { name = "pion_multiplicity",         type = "both", parameters = [ "@pion_threshold"     ] },
    { name = "proton_multiplicity",       type = "both", parameters = [ "@proton_threshold"   ] },
    { name = "track_length",              type = "both", parameters = [ "@trackLength_threshold" ] },
    { name = "containment_cut",           type = "reco_particle", selector = "leading_muon", title = "mu_containment_cut"},
    { name = "has_particle_multiplicity", type = "both", parameters = [1, 2] },
    { name = "leading_muon_energy_cut",   type = "both", parameters = [ "@muon_threshold" ] },
    { name = "muon_softmax_cut",          type = "reco", parameters = [ "@muon_softmax", "@greater_than" ] },
    { name = "primary_muon_softmax_cut",  type = "reco", parameters = [ "@primary_muon_softmax", "@greater_than" ] },

    # Vertex & flash
    { name = "vertex_x",                  type = "both" },
    { name = "vertex_y",                  type = "both" },
    { name = "vertex_z",                  type = "both" },
    { name = "flash_time",                type = "reco" },
    { name = "flash_total_pe",            type = "reco" },
    { name = "flash_hypothesis",          type = "reco" },

    # Interaction-level
    { name = "is_nu",                     type = "both"    },
    { name = "is_data",                   type = "both"    },
    { name = "cc",                        type = "mctruth" },
    { name = "category",                  type = "true"    },
    { name = "interaction_mode",          type = "mctruth" },
    { name = "interaction_type",          type = "mctruth" },
    { name = "cut_type",                  type = "both"    },
    { name = "fiducial",                  type = "both"    },
    { name = "neutrino_id",               type = "true"    },
    { name = "pdg",                       type = "mctruth" },
    { name = "parent_pdg",                type = "mctruth" },
    { name = "baseline",                  type = "mctruth" },
    { name = "neutrino_energy",           type = "mctruth" },  
    { name = "visible_energy",            type = "both"    },
    { name = "hadronic_visible_energy",   type = "both"},
    { name = "visible_energy_calosub",    type = "both"    },

    # Kinematic imbalance & angles
    { name = "opening_angle",             type = "both"},
    { name = "opening_angle_deg",         type = "both" },
    { name = "opening_angle_cos",         type = "both" },
    { name = "dpT",                       type = "both" },
    { name = "dpT_lp",                    type = "both" },
