[[tree]]
name = "nc_sideband"
sim_only = false
add_systematics = false
mode = "reco"
cut = [
     { name = "no_cut",                   type = "reco" },
     { name = "fiducial_cut",             type = "reco" },
     { name = "flash_cut",                type = "reco", parameters = [ "@flash_low_t", "@flash_high_t" ] },
    #{ name = "containment_cut",          type = "reco" },
    #{ name = "vertex_distance_cut",      type = "reco", parameters = [ "@vertex_threshold" ] },
    #{ name = "has_particle_multiplicity",type = "reco", parameters = [1, 1] },
     { name = "no_electrons",             type = "reco", parameters = [ "@electron_threshold" ] },
     { name = "no_charged_pions",         type = "reco", parameters = [ "@pion_threshold" ] },
     { name = "has_particle_multiplicity",type = "reco", parameters = [ 0.0, 2.0, 25.0 ], title = "has_photons"}, 
     { name = "leading_photon_energy_cut",type = "reco", parameters = [ 40.0 ] }
]

branch = [
    # cuts
    { name = "no_cut",                    type = "both"    },
    { name = "neutrino",                  type = "true"    },
    { name = "fiducial",                  type = "both"    },
    { name = "fiducial_cut",              type = "both"    },
    { name = "valid_flashmatch",          type = "both"    },
    { name = "containment",               type = "both"    },
    { name = "containment_cut",           type = "both"    },

    # cuts as branch variables
    { name = "flash_cut",                 type = "both", parameters = [ "@flash_low_t", "@flash_high_t" ] },
    { name = "no_photons",                type = "both", parameters = [ "@photon_threshold"   ] },
