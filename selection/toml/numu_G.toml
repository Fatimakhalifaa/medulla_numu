[parameters]
photon_threshold = 25.0
electron_threshold = 25.0
#muon_threshold = 143.425
muon_threshold = 300.0
muon_ke_threshold  = 194.342
pion_threshold = 25.0
proton_threshold = 50.0
trackLength_threshold = 190.0
electron_dedx = 3.625
flash_low_t = 0.0
flash_high_t = 9.6
muon_softmax = 0.5
primary_muon_softmax = 0.85
electron_id = 1.0
greater_than = 1.0
zenith_threshold        = 36.5    #20.0   # deg; leading_muon_zenith_cut
flash_score_threshold   = 1.0     #0.0 unitless; flash_score_cut (0 = disabled by default)
flash_pe_ratio_lo       = 0.4175  #0.5 flash_pe_consistency_cut lower bound
flash_pe_ratio_hi       = 1.5825  #2.0 flash_pe_consistency_cut upper bound
muon_vertex_gap_thresh  = 10.0    #5.0 cm; muon_vertex_gap_cut
mcs_csda_diff_thresh    = 1.5     #0.25  fractional; muon_reco_quality_cut
michel_min_depositions  = 10.0
michel_muon_ke_thresh   = 143.425
michel_dist_thresh      = 10.0


[general]
output = "output_numuCCInclusive_uncontained_numu_coh"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_ke_threshold",
    "@pion_threshold",
    "@proton_threshold",
    "@muon_softmax",
    "@primary_muon_softmax",
    "@flash_low_t",
    "@flash_high_t",
    "@greater_than",
]

