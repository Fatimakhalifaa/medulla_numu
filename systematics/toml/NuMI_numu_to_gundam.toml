[output]
path = '/exp/icarus/data/users/fatima/Medulla_output/Systematics/pre_gundam/numu_all_sys.root'   # merged + POT-corrected file = to_gundam input

[gundam]
output = '/exp/icarus/data/users/fatima/Medulla_output/Systematics/to_gundam/numu_all_sys_to_gundam.root'
multisim = 'merge'
multisim_cap = '30'                     # G4 multisim weights > 30 (or negative / non-finite) -> 1, same as the plots
# Phase-space fill (nu_mu only)
fill_table = '/exp/icarus/data/users/fatima/medulla_numu/systematics/toml/exiting_fill_table.json'   # notebook 7.17 output; adjust path
exiting_energy = 'true_muon_energy_synth'
exiting_energy_scale = '1.0'            # GeV; use '0.001' for an MeV branch
# Defaults, only needed if branch names differ:
# fill_containment = 'reco_leading_muon_containment'
# fill_elep        = 'reco_leptonic_visible_energy'
# fill_evis        = 'reco_visible_energy'
# fill_cos         = 'reco_leading_muon_cos_theta_mu'
# fill_ehad        = 'reco_hadronic_visible_energy'
# fill_rest        = 'reco_hadronic_visible_energy_rest'
# fill_vertex_x/y/z = 'reco_vertex_x' / 'reco_vertex_y' / 'reco_vertex_z'

[[sysvar]]
name = 'reco_visible_energy'
bins = [30, 0, 5]

# Systematics trees are read from <origin>_<type>Tree, e.g. events/cvext/selected_multisigmaTree.
# Missing systematics trees are skipped with a message, so gundam_store_syst = true is safe.
[[tree]]
origin = 'events/cvext/selected'
destination = 'events/cvext/'
name = 'selected'
gundam_store_syst = true
is_nu = true
is_data = false
pot_scale = '1.0'           # CVEXT failed-spill factor (0.922204) already applied to the file by apply_pot.py

[[tree]]
origin = 'events/cvext/signal'
destination = 'events/cvext/'
name = 'signal'
gundam_store_syst = true    # xsec + flux on the signal tree (efficiency); skipped if signal_*Tree are absent
is_nu = true
is_data = false
fill = false                # true-signal tree: no reco fill branches (efficiency denominator)

[[tree]]
origin = 'events/data/selected'
destination = 'events/data/'
name = 'onbeam'
gundam_store_syst = false
is_nu = true
is_data = true

[[tree]]
origin = 'events/offbeam/selected'
destination = 'events/offbeam/'
name = 'offbeam'
gundam_store_syst = false
is_nu = false
is_data = true

[[tree]]
origin = 'events/G4/selected'
destination = 'events/G4/'
name = 'selected'
gundam_store_syst = true    # Geant4 reinteraction universes (multisim vectors) for the G4 covariance
is_nu = true
is_data = false

